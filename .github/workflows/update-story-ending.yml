name: Update story ending

on:
  push:
    paths:
      - '.github/workflows/update-story-ending.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chapters 10-11 and epilogue
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          ch10 = '''                        <!-- Chapter 10 -->
                        <section id="chapter-10" class="chapter">
                            <h2>Chapter 10: Detection &amp; Response</h2>
                            <pre><span class="out">Log File: session_log_apt-010.txt
Alias: theAdversary
Target: cameron.local</span>

[BEGIN LOG]

<span class="cmd">theAdversary@attackerbox:~$ ssh cameron@cameron.local</span>
<span class="out">&gt; Connection granted
&gt; Limited shell access: non-root
&gt; Privilege escalation dependent on user permission and neglect</span>

<span class="cmt"># Root belonged to someone else. Always did.
# But I had persistence:
# shame, isolation, control, self-reliance.</span>

<span class="cmd">cameron@cameron.local:/journal$ tail -n 5 signal.log</span>
<span class="out">&gt; I'm tired. But I don't want to die.
&gt; I want peace. I just don't know how.
&gt; I've tried everything I know.
&gt; God, if You're there... help me.
&gt; You can have the console.</span>

<span class="cmt"># Uh-oh.</span>

<span class="cmd">cameron@cameron.local:/ports$ netstat -an | grep 7777</span>
<span class="out">tcp        0      0 127.0.0.1:7777      0.0.0.0:*       LISTEN</span>

<span class="cmt"># Activity detected on privileged channel: /root-access
# Ownership trace: confirmed → Creator</span>

<span class="cmd">cameron@cameron.local:/processes$ lsof -i :7777</span>
<span class="out">COMMAND   PID   USER     FD   TYPE DEVICE SIZE/OFF NODE NAME
creatord  1337  root     3u   IPv4  54321      0t0  TCP *:7777 (LISTEN)</span>

<span class="cmt"># The root daemon was always listening.
# Cameron had spent years trying to become root:
# fix himself, fix everyone else, control the outcome,
# carry what was never his to carry.</span>

<span class="cmd">cameron@cameron.local:/journal$ echo "I can't do this alone." &gt;&gt; surrender.log</span>

<span class="out">&gt; No privilege escalation attempted.
&gt; No exploit executed.
&gt; No patch deployed.
&gt; Help requested.</span>

<span class="cmd">theAdversary@attackerbox:~$ sudo whisper.sh</span>
<span class="out">&gt; You're still broken.
&gt; You will always be broken.
&gt; If this worked, you wouldn't still hear me.</span>

<span class="cmd">cameron@cameron.local:~$ ps aux | grep whisper</span>
<span class="out">&gt; Process detected.</span>

<span class="cmt"># Not terminated.</span>

<span class="cmd">cameron@cameron.local:~$ cat /etc/origin.conf.disabled</span>
<span class="cmt"># ORIGIN CONFIGURATION - READ ONLY
# Created: before time
# Author: Creator
#
# cameron.local was designed with purpose.
# cameron.local was designed for connection.
# cameron.local was designed to be loved.
#
# Vulnerability detected:
# cameron.local cannot sustain itself.
#
# Correction:
# This is not a defect.</span>

<span class="creator">creator@cameron.local:~$ sudo mv /etc/origin.conf.disabled /etc/origin.conf</span>

<span class="cmd">cameron@cameron.local:/motd$ cat current</span>
</pre>
<div class="motd" aria-label="Message of the day">I didn't make a good Cameron or a bad Cameron.
I made Cameron.
I know Cameron.
I love Cameron.</div>
<pre>
<span class="cmd">theAdversary@attackerbox:~$ send --payload "Then why do you still need help?"</span>
<span class="out">&gt; Payload received.</span>

<span class="cmd">cameron@cameron.local:~$ echo "Because I still need help." &gt;&gt; truth.log</span>

<span class="cmt"># Unexpected response.
# Dependency no longer classified as failure.</span>

<span class="cmd">cameron@cameron.local:~$ systemctl enable honesty.service</span>
<span class="out">Created symlink.</span>

<span class="cmd">cameron@cameron.local:~$ systemctl enable surrender.service</span>
<span class="out">Created symlink.</span>

<span class="cmd">cameron@cameron.local:~$ ufw allow from community.local</span>
<span class="out">Rule added.</span>

<span class="cmt"># No permanent remediation recorded.
# Detection improved.
# Response plan established.
# theAdversary remains persistent.</span>

[END LOG]</pre>
                        </section>'''

          ch11 = '''                        <!-- Chapter 11 -->
                        <section id="chapter-11" class="chapter">
                            <h2>Chapter 11: Persistence</h2>
                            <pre><span class="out">Log File: session_log_apt-011.txt
Alias: theAdversary
Target: cameron.local</span>

[BEGIN LOG]

<span class="cmt"># Current operating environment.</span>

<span class="cmd">theAdversary@attackerbox:~$ ping cameron.local</span>
<span class="out">&gt; Reply received.</span>

<span class="cmt"># Target online.
