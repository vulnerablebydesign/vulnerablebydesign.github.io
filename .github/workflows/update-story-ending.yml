I try to help someone else along the way.

And tomorrow, if I'm given tomorrow, I'll do it again.</div>
<pre>
<span class="cmd">cameron@cameron.local:~$ whoami</span>
<span class="out">cameron</span>

<span class="cmd">cameron@cameron.local:~$ id</span>
<span class="out">uid=1000(cameron) gid=1000(human) groups=family,community,fellowship</span>

<span class="cmd">cameron@cameron.local:~$ sudo su</span>
<span class="out">&gt; Access denied.</span>

<span class="cmd">cameron@cameron.local:~$ echo $?</span>
<span class="out">1</span>

<span class="cmd">cameron@cameron.local:~$ echo "Good."</span>

<span class="cmt"># STATUS: ONLINE
# UPTIME: TODAY
# VULNERABILITIES: PRESENT
# DEPENDENCIES: ACTIVE
# ROOT: CREATOR
# MAINTENANCE: DAILY
# RESTORATION: IN PROGRESS</span>

<span class="cmd">cameron@cameron.local:~$ _</span>

[END EPILOGUE]</pre>
                        </section>'''

          def replace_section(text, marker, replacement, next_marker):
              pattern = re.escape(marker) + r'.*?(?=' + re.escape(next_marker) + r')'
              new, n = re.subn(pattern, replacement + '\n\n                        ', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected one match for {marker}, got {n}')
              return new

          s = replace_section(s, '                        <!-- Chapter 10 -->', ch10,
                              '                        <div class="chapter-break" aria-hidden="true">')
          # After replacing ch10, target the divider immediately before Chapter 11 by matching Chapter 11 itself through its following divider.
          s = replace_section(s, '                        <!-- Chapter 11 -->', ch11,
                              '                        <div class="chapter-break" aria-hidden="true">')
          s = replace_section(s, '                        <!-- Epilogue -->', epi,
                              '                        <!-- Crisis resources (repeated) -->')

          s = s.replace('<li><a href="#chapter-11" role="menuitem">Ch 11: Foothold Attempts</a></li>',
                        '<li><a href="#chapter-11" role="menuitem">Ch 11: Persistence</a></li>')
          s = s.replace("'chapter-10': { load: 20,  mem: 25,  conn: 5,  fw: 'grace.enforced', color: '#ffffcc', state: 'OVERRIDE'   }",
                        "'chapter-10': { load: 20,  mem: 25,  conn: 5,  fw: 'grace.enforced', color: '#ffffcc', state: 'RESPONSE'   }")
          s = s.replace("'chapter-11': { load: 12,  mem: 15,  conn: 6,  fw: 'grace.enforced', color: '#33ff33', state: 'SECURED'    }",
                        "'chapter-11': { load: 25,  mem: 30,  conn: 5,  fw: 'grace.enforced', color: '#66cc33', state: 'PERSISTENT' }")
          s = s.replace("'epilogue':   { load: 8,   mem: 10,  conn: 7,  fw: 'grace.enforced', color: '#33ff33', state: 'RESTORED'   }",
                        "'epilogue':   { load: 10,  mem: 15,  conn: 7,  fw: 'grace.enforced', color: '#33ff33', state: 'ONLINE'     }")

          p.write_text(s)
          PY

          rm .github/workflows/update-story-ending.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-story-ending.yml
          git commit -m "Revise final chapters around ongoing surrender and dependence"
          git push
