name: Run story update

on:
  push:
    paths:
      - '.github/update-story-trigger'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute prepared story update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/update-story-ending.yml').read_text()
          marker = '        run: |\n'
          block = text.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  break
              else:
                  lines.append('')
          Path('/tmp/story-update.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/story-update.sh
