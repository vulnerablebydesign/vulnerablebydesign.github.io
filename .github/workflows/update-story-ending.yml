<span class="adversary-log">[06:29:58] theAdversary[c2]: Target waking.
[06:29:59] theAdversary[c2]: Begin whisper sequence.</span>

<span class="out">&gt; You're behind.
&gt; You're not enough.
&gt; Fix it.
&gt; Control it.
&gt; Don't let anyone see you struggle.</span>

<span class="sys">[06:30:00] cameron.local: outbound connection initiated
&gt; fellowship.local connected</span>

<span class="cmt"># Threat activity continues.
# So does the connection.</span>

<span class="cmd">theAdversary@spoof:~$ ./inject.sh \
  --payload="If you don't manage this, everything will fall apart."</span>

<span class="out">&gt; Payload received.
&gt; Execution started.</span>

<span class="cmd">cameron@cameron.local:/identity$ cat status.txt</span>
<span class="out">&gt; afraid
&gt; defensive
&gt; proving
&gt; controlling</span>

<span class="cmt"># Detection delayed.</span>

<span class="cmd">cameron@cameron.local:~$ tail -f /var/log/internal.log</span>
<span class="out">&gt; Why am I trying to control this?
&gt; Why don't I want anyone to know?
&gt; Why does this feel familiar?</span>

<span class="cmt"># Signature match found.</span>

<span class="cmd">cameron@cameron.local:~$ contacts --recent</span>
<span class="out">&gt; sponsor.thread
&gt; fellowship.local
&gt; friends.local
&gt; family.local</span>

<span class="cmd">cameron@cameron.local:~$ connect --honest</span>
<span class="out">&gt; Connection established.
&gt; User disclosed current state.</span>

<span class="cmd">cameron@cameron.local:/prayer$ ./morning_request.sh</span>
<span class="out">&gt; What would You have me do today?
&gt; Give me the power to carry that out.</span>

<span class="cmt"># No roadmap returned.
