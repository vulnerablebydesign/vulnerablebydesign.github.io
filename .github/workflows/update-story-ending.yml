<span class="cmd">theAdversary@spoof:~$ start_loop --task="Do everything. Prove your worth."</span>
<span class="out">&gt; Loop initialized

&gt; CPU: 97%
&gt; prayer.net connection degraded
&gt; community.local packets delayed
&gt; self-awareness monitoring suspended</span>

<span class="cmt"># Attack successful.</span>

<span class="cmd">cameron@cameron.local:~$ killall control</span>
