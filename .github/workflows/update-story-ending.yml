&gt; Not alone.</span>

[END LOG]</pre>
                        </section>'''

          epi = '''                        <!-- Epilogue -->
                        <section id="epilogue" class="chapter">
                            <h2>Epilogue: The Terminal is Still Open</h2>
                            <pre>[BEGIN EPILOGUE]

<span class="cmd">cameron@cameron.local:/life$ uptime</span>
<span class="out">&gt; System uptime: today</span>

<span class="cmd">cameron@cameron.local:~$ systemctl status recovery.service</span>
<span class="out">● recovery.service
  Loaded: enabled
  Active: active
  State: continuous
  Requires: connection.target
  Restart: daily</span>

<span class="cmd">cameron@cameron.local:~$ systemctl status surrender.service</span>
<span class="out">● surrender.service
  Loaded: loaded
  Active: inactive (dead)</span>

<span class="cmt"># Manual start required.
# Execution remains imperfect.</span>

<span class="cmd">cameron@cameron.local:~$ cat /etc/origin.conf | head</span>
<span class="cmt"># ORIGINAL DESIGN
#
# cameron.local was not designed to be root.
# cameron.local was not designed to run alone.
# cameron.local was designed for connection.
# cameron.local was designed to give and receive love.
# cameron.local was designed to need others.
#
# Vulnerability is not always a defect.</span>

<span class="cmd">theAdversary@attackerbox:~$ send --payload "You should have this figured out by now."</span>
<span class="out">&gt; Payload delivered.</span>

<span class="cmd">cameron@cameron.local:~$ cat /var/log/internal.log | tail -1</span>
<span class="out">&gt; Maybe I should.</span>

<span class="cmt"># Process spawned.</span>

<span class="cmd">cameron@cameron.local:~$ ps aux | grep shame</span>
<span class="out">&gt; shame_loop        RUNNING</span>

<span class="cmt"># Detection delayed.</span>

<span class="cmd">cameron@cameron.local:~$ echo "God, help me."</span>

<span class="cmd">cameron@cameron.local:~$ connect community.local</span>
<span class="out">&gt; Connected.</span>

<span class="cmd">cameron@cameron.local:~$ echo "Here's what's actually going on..."</span>
<span class="out">&gt; Transmission started.</span>

<span class="cmt"># theAdversary has not been eliminated.
# cameron.local has not been perfected.
# No final patch has been deployed.
#
# Something else changed.
#
# For most of his life,
# vulnerability meant attack surface.
#
# A place something could get in.
#
# He spent years trying to close every port.
# Hide every weakness.
# Carry every burden.
# Become strong enough that he would never need anyone.
#
# It nearly killed him.
#
# Now the same open ports carry different traffic.</span>

<span class="sys">&gt; prayer.net
&gt; community.local
&gt; confession.socket
&gt; love.service</span>

<span class="cmt"># Vulnerability is still an attack surface.
#
# It is also how help gets in.</span>

<span class="cmd">cameron@cameron.local:/mission$ cat legacy.txt</span></pre>
<div class="legacy">If you're reading this, I can't tell you that I found the way out of the maze.

I can tell you what happened when I stopped pretending I could.

I asked for help.

I still do.

Some days I recognize theAdversary immediately.
Sometimes I discover I've been listening for hours.
Sometimes I try to take the console back and run everything myself.

Then I come back.

I tell the truth.
I ask for help.
I seek God.
I listen.
